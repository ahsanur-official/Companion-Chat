    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;
          if (typeof window !== 'undefined') {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return customFetch || originalFetch;
              },
              set: function(val) {
                customFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          try {
            if (typeof window !== 'undefined' && window.Window && window.Window.prototype) {
              var protoFetch = window.Window.prototype.fetch;
              Object.defineProperty(window.Window.prototype, 'fetch', {
                get: function() {
                  return customFetch || protoFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();

      // Suppress benign Vite HMR WebSocket connection closed warning in cloud container preview
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('[vite] failed to connect') !== -1) {
          event.preventDefault();
        }
      });
    </script>
